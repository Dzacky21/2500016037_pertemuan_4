<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan 5 - To-Do List</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .todo-card {
            background-color: #ffffff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 400px;
        }

        h2 {
            margin-bottom: 15px;
            color: #2c3e50;
            font-size: 20px;
            text-align: center;
        }

        .input-container {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }

        #task-input {
            flex: 1;
            padding: 8px 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            outline: none;
        }

        #task-input:focus {
            border-color: #007bff;
        }

        #add-task {
            padding: 8px 14px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }

        #add-task:hover {
            background-color: #0056b3;
        }

        #task-list {
            list-style: none;
            padding: 0;
        }

        #task-list li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f8f9fa;
            padding: 8px 12px;
            border: 1px solid #e9ecef;
            border-radius: 4px;
            margin-bottom: 8px;
        }

        #task-list li input[type="checkbox"] {
            margin-right: 10px;
            cursor: pointer;
        }

        #task-list li span {
            flex: 1;
            font-size: 14px;
            word-break: break-all;
        }

        #task-list li button {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
        }

        #task-list li button:hover {
            background-color: #bd2130;
        }
    </style>
</head>
<body>

    <div class="todo-card">
        <h2>Latihan 5: To-Do List</h2>
        <div id="output5"></div>
    </div>

    <script src="latihan5.js"></script>
</body>
</html>
